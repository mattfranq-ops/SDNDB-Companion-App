<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>SDNDBZ Companion</title>
  <style>
    html,body{margin:0;padding:0;background:#0A0C11;height:100%;}#root{height:100%;}
    /* Use the app's own +/- steppers only — hide the browser number spinners. */
    input[type=number]{-moz-appearance:textfield;}
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="bundle.js"></script>
</body>
</html>
